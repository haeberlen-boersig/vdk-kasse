<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kassenhilfe VdK Nendingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --band:#E9EBEF; --page:#F3F4F6; --ink:#1A1A1A; --muted:#5F6670;
  --navy:#1E3F78; --navy-dark:#16305C; --line:#DADDE3; --pick:#EEF3FB; --danger:#B3382C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Lexend","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.35;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

.sheetpaper{max-width:640px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:150px;
  box-shadow:0 0 0 1px var(--line)}
.letterhead{position:relative;overflow:hidden;background:var(--band);height:76px;padding:0 18px;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;border-bottom:4px solid var(--navy)}
.letterhead .big{font-size:1.05rem;font-weight:700;color:var(--navy);line-height:1.1}
.letterhead .big small{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-right:6px}
.letterhead .sub2{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin-top:3px}
.kaethe{position:absolute;left:14px;bottom:0;height:72px;aspect-ratio:320/222;pointer-events:none;
  transform:translateY(110%);animation:rise 9s ease-in-out 1s infinite}
.kaethe img{position:absolute;inset:0;width:100%;height:100%}
.kaethe .arm{transform-origin:5.4% 88.8%;animation:wave 9s ease-in-out 1s infinite}
@keyframes rise{
  0%{transform:translateY(110%);animation-timing-function:ease-out}
  11%,52%{transform:translateY(0)}
  60%,100%{transform:translateY(110%)}
}
@keyframes wave{
  0%,13%{transform:rotate(0)}
  17%{transform:rotate(-12deg)}
  21%{transform:rotate(10deg)}
  25%{transform:rotate(-12deg)}
  29%{transform:rotate(10deg)}
  33%{transform:rotate(-12deg)}
  37%{transform:rotate(10deg)}
  41%,100%{transform:rotate(0)}
}
@media (prefers-reduced-motion: reduce){.kaethe,.kaethe .arm{animation:none!important;transform:none}}
.intro{padding:18px 20px 0;color:var(--muted);font-size:.92rem}
section.menu{padding:10px 12px 0}
h2{font-size:.85rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);
  margin:22px 8px 6px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;background:var(--navy);opacity:.25}

.row{display:flex;align-items:stretch;gap:6px;margin:4px 0}
.item{flex:1;min-width:0;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:12px;row-gap:1px;
  min-height:56px;padding:8px 12px 8px 8px;border:0;border-radius:12px;background:transparent;text-align:left;
  text-transform:uppercase;font-size:.95rem;letter-spacing:0;line-height:1.2;transition:background .12s}
.item > .n{grid-column:1;grid-row:1 / 3}
.item > span:nth-child(2){grid-column:2;grid-row:1;align-self:end;overflow-wrap:break-word;hyphens:auto}
.item > .size{grid-column:2;grid-row:2;align-self:start}
.item > .price{grid-column:3;grid-row:1 / 3}
.item > .size:empty{display:none}
.item > span:nth-child(2):has(+ .size:empty){grid-row:1 / 3;align-self:center}
.item:active{background:var(--pick)}
.row.has .item{background:var(--pick)}
.n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.95rem;color:transparent;border:1.5px solid #CDD3DE}
.row:not(.has) .n::before{content:"+";color:#8A93A0;font-weight:500;font-size:1.1rem;line-height:1}
.row.has .n{background:var(--navy);color:#fff;border-color:var(--navy)}
.size{color:var(--muted);font-size:.82rem;text-transform:none;white-space:nowrap}
.price{font-variant-numeric:tabular-nums;text-transform:none;white-space:nowrap;text-align:right;font-weight:500}
.minus{flex:none;width:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:1.4rem;visibility:hidden}
.row.has .minus{visibility:visible}
.bump{animation:bump .18s ease}
@keyframes bump{50%{transform:scale(1.25)}}

.stats{margin:28px 20px 0;padding:12px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-inner{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sum{flex:1 1 110px;min-width:0}
.sum small{display:block;opacity:.85;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum strong{display:block;font-weight:700;font-size:clamp(1.3rem,6.5vw,1.9rem);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.pay{flex:0 0 auto;background:#fff;color:var(--navy);border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:1rem;white-space:nowrap}
.pay:disabled{opacity:.45}
.clear{flex:none;background:transparent;border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:12px;padding:13px 11px;font-size:.92rem;white-space:nowrap}

.sheet-bg{position:fixed;inset:0;background:rgba(15,25,45,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.receipt{border:1.5px solid var(--line);border-top:5px solid var(--navy);border-radius:4px 4px 12px 12px;padding:14px 16px;margin:4px 0 14px}
.receipt h3{margin:0;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--navy)}
.receipt .when{color:var(--muted);font-size:.85rem;margin:2px 0 10px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.qty{font-weight:700;color:var(--navy)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.total span:last-child{font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums}
.cash label{display:block;font-weight:500;margin-bottom:6px}
.cash input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--page);color:var(--ink);font:inherit;font-size:1.3rem}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--page);font-weight:700}
.change{margin-top:12px;padding:14px;border-radius:12px;background:var(--pick);display:flex;justify-content:space-between;align-items:baseline}
.change b{font-size:1.6rem}
.change.short b{color:var(--danger)}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions .pay{flex:1;white-space:normal;background:var(--navy);color:#fff}
.back{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:15px 16px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;
  font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (max-width:360px){.item{font-size:.9rem;column-gap:9px;padding-right:8px}.minus{width:40px}section.menu{padding:10px 8px 0}}
@media (max-width:330px){.bar .pay{flex:1 0 100%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <section class="menu" aria-labelledby="h-food">
    <h2 id="h-food">Speisen</h2>
    <div class="row" data-name="Schwäbischer Vesperteller" data-price="800"><button class="item"><span class="n"></span><span>Schwäbischer Vesperteller</span><span class="size"></span><span class="price">8,00 €</span></button><button class="minus" aria-label="Eins weniger">−</button></div>

  <div class="stats" id="stats">Heute auf diesem Gerät: 0 Verkäufe, 0,00 € Umsatz</div>
</div>

<div class="bar">
  <div class="bar-inner">
    <button class="clear" id="clearBtn">Leeren</button>
    <div class="sum"><small id="itemCount">Summe</small><strong id="totalTop">0,00 €</strong></div>
    <button class="pay" id="payBtn" disabled>Abrechnen</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-label="Rechnung">
  <div class="sheet">
    <div class="receipt" id="receipt"></div>
    <div class="cash">
      <label for="given">Gegeben</label>
      <input id="given" inputmode="decimal" placeholder="z. B. 20" autocomplete="off">
      <div class="quick" id="quick"></div>
      <div class="change" id="changeBox" hidden><span id="changeLabel">Rückgeld</span><b id="changeVal"></b></div>
    </div>
    <div class="sheet-actions">
      <button class="back" id="backBtn">Zurück</button>
      <button class="pay" id="doneBtn">Bezahlt – nächster Kunde</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var rows = Array.prototype.slice.call(document.querySelectorAll(".row"));
  var cart = rows.map(function(){return 0;});
  function $(id){return document.getElementById(id);}
  function fmt(c){return (c/100).toFixed(2).replace(".",",")+" €";}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var stats={sales:0,cents:0};
  try{var s=localStorage.getItem("kh_vdk_stats");if(s)stats=JSON.parse(s);}catch(e){}
  function saveStats(){try{localStorage.setItem("kh_vdk_stats",JSON.stringify(stats));}catch(e){}}

  function total(){var n=0,c=0;rows.forEach(function(r,i){n+=cart[i];c+=cart[i]*+r.dataset.price;});return {n:n,c:c};}
  function render(){
    rows.forEach(function(r,i){
      r.classList.toggle("has",cart[i]>0);
      r.querySelector(".n").textContent=cart[i]||"";
    });
    var t=total();
    $("totalTop").textContent=fmt(t.c);
    $("itemCount").textContent=t.n?t.n+" Artikel":"Summe";
    $("payBtn").disabled=!t.n;
    $("stats").textContent="Heute auf diesem Gerät: "+stats.sales+" Verkäufe, "+fmt(stats.cents)+" Umsatz";
  }
  rows.forEach(function(r,i){
    r.querySelector(".item").addEventListener("click",function(){
      cart[i]++;render();
      var n=r.querySelector(".n");n.classList.remove("bump");void n.offsetWidth;n.classList.add("bump");
    });
    r.querySelector(".minus").addEventListener("click",function(){if(cart[i])cart[i]--;render();});
  });

  function openSheet(){
    var t=total(),now=new Date();
    var h='<h3>Rechnung</h3><div class="when">'+now.toLocaleDateString("de-DE")+", "+now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+' Uhr</div>';
    rows.forEach(function(r,i){if(cart[i])h+='<div class="line"><span class="qty">'+cart[i]+'×</span><span>'+esc(r.dataset.name)+'</span><span>'+fmt(cart[i]*+r.dataset.price)+'</span></div>';});
    h+='<div class="total"><span>Summe</span><span>'+fmt(t.c)+'</span></div>';
    $("receipt").innerHTML=h;
    $("given").value="";$("changeBox").hidden=true;
    var q=$("quick");q.innerHTML="";
    var opts=[Math.ceil(t.c/100),5,10,20,50].filter(function(v,ix,a){return v*100>=t.c&&a.indexOf(v)===ix;}).sort(function(a,b){return a-b;}).slice(0,4);
    opts.forEach(function(v){var b=document.createElement("button");b.textContent=v+" €";b.onclick=function(){$("given").value=v;calc();};q.appendChild(b);});
    $("sheetBg").classList.add("open");
  }
  function calc(){
    var g=parseFloat(String($("given").value).replace(",","."));
    var box=$("changeBox");
    if(isNaN(g)){box.hidden=true;return;}
    var d=Math.round(g*100)-total().c;
    box.hidden=false;box.classList.toggle("short",d<0);
    $("changeLabel").textContent=d<0?"Fehlt noch":"Rückgeld";
    $("changeVal").textContent=fmt(Math.abs(d));
  }
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}

  $("payBtn").onclick=openSheet;
  $("clearBtn").onclick=function(){cart=cart.map(function(){return 0;});render();};
  $("given").addEventListener("input",calc);
  $("backBtn").onclick=function(){$("sheetBg").classList.remove("open");};
  $("sheetBg").addEventListener("click",function(e){if(e.target.id==="sheetBg")$("sheetBg").classList.remove("open");});
  $("doneBtn").onclick=function(){
    stats.sales++;stats.cents+=total().c;saveStats();
    cart=cart.map(function(){return 0;});$("sheetBg").classList.remove("open");render();toast("Bezahlt – nächster Kunde");
  };
  render();
})();
</script>
